<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Rounded Black Base -->
  <rect width="512" height="512" rx="112" fill="#000000" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#222222" stroke-width="4" />

  <!-- Khairy Hybrid Runner Icon in Yellow #D4EC26 -->
  <g transform="translate(71, 75) scale(2.2)">
    <g stroke="#D4EC26" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
      <!-- Upper Left Pill -->
      <line x1="64" y1="43" x2="84" y2="23" />
      <!-- Center Long Pill -->
      <line x1="16" y1="144" x2="113" y2="47" />
      <!-- Right Pill -->
      <line x1="64" y1="147" x2="151" y2="60" />
    </g>
    <!-- Head Circle -->
    <circle cx="142" cy="16" r="16" fill="#D4EC26" />
  </g>
</svg>
