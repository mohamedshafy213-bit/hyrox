<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 160" width="340" height="160" fill="none">
  <defs>
    <style>
      .arch-text-red {
        font-family: 'Chakra Petch', 'Impact', 'Arial Black', sans-serif;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
    </style>
    <path id="archCurveRed" d="M 20,74 Q 170,38 320,74" />
  </defs>
  
  <!-- Stacked Brand Logo in Primary Red #FF4438 -->
  <g fill="#FF4438">
    <!-- Top Arched Text: TRAIN BEYOND -->
    <text font-size="36" font-weight="900" class="arch-text-red" text-anchor="middle">
      <textPath href="#archCurveRed" startOffset="50%" text-anchor="middle">
        TRAIN BEYOND
      </textPath>
    </text>
    
    <!-- Bottom Straight Text: LIMITS -->
    <text x="170" y="128" font-size="44" font-weight="900" class="arch-text-red" text-anchor="middle" letter-spacing="3px">
      LIMITS
    </text>
  </g>
</svg>
